
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VELNIXO STORE</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f5f5f5;color:#222}
header{background:#111;color:white;padding:22px;text-align:center}
header h1{letter-spacing:4px;margin:5px}
nav{background:#222;padding:14px;text-align:center;color:white}
.hero{text-align:center;padding:65px 15px;background:#e9e9e9}
.hero h2{font-size:34px}
.hero button{background:#111;color:white;padding:14px 25px;border:0;border-radius:5px}
.products{padding:25px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
.product{background:white;padding:20px;border-radius:10px}
.product .photo{font-size:55px;background:#eee;padding:25px}
.product button{background:#111;color:white;border:0;padding:10px;border-radius:5px}
footer{background:#111;color:white;text-align:center;padding:25px;margin-top:30px}
</style>
</head>
<body>
<header>
<h1>VELNIXO</h1>
<p>YOUR STYLE, YOUR CHOICE</p>
</header>
<nav>HOME | SHOP | CONTACT</nav>
<section class="hero">
<h2>WELCOME TO VELNIXO</h2>
<p>Discover Your Favourite Products</p>
<button onclick="document.getElementById('shop').scrollIntoView()">SHOP NOW</button>
</section>
<section class="products" id="shop">
<h2>OUR PRODUCTS</h2>
<div class="grid">
<div class="product">
<div class="photo">👕</div>
<h3>Product 1</h3>
<p>Price: Rs. 0</p>
<button onclick="order('Product 1')">Order Now</button>
</div>
<div class="product">
<div class="photo">👟</div>
<h3>Product 2</h3>
<p>Price: Rs. 0</p>
<button onclick="order('Product 2')">Order Now</button>
</div>
</div>
</section>
<footer>
<h3>VELNIXO STORE</h3>
<p>Thank you for visiting!</p>
</footer>
<script>
function order(product){
alert("Welcome! Contact us on WhatsApp to order: "+product);
}
</script>
</body>
</html>
